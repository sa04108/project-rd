[preset.0]

name="Android QA Debug"
platform="Android"
runnable=true
dedicated_server=false
custom_features="android_qa"
export_filter="all_resources"
include_filter="data/*.json,assets/art/**/*.json,assets/fonts/*LICENSE*.txt"
exclude_filter="tools/**,docs/**,tests/**,artifacts/**,assets/art/families/**/sprite_run/raw/**"
export_path="res://artifacts/android/project-rd-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
permissions/vibrate=true
package/unique_name="org.projectrd.debug"
package/name="project-rd Android QA"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
version/code=1
version/name="0.3.0-qa"
graphics/opengl_debug=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args="-- --android-qa"
gradle_build/use_gradle_build=false

[preset.1]

name="Web Preview"
platform="Web"
runnable=true
dedicated_server=false
custom_features="web"
export_filter="all_resources"
include_filter="data/*.json,assets/art/**/*.json,assets/fonts/*LICENSE*.txt"
exclude_filter="tools/**,docs/**,tests/**,artifacts/**,assets/art/**/sprite_run/**,assets/art/families/**/source.png,assets/art/families/**/source.png.import,assets/art/families/**/sprite-inspect.report.json,assets/art/families/**/sprite-score.report.json,assets/art/families/**/pipeline-receipt.json,assets/art/backgrounds/battlefield.png,assets/art/orthographic/*.prompt.txt,.godot/imported/source.png-*"
export_path="res://artifacts/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
