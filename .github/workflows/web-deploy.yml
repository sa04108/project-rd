name: Web deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-rd-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install export dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - uses: actions/cache@v6
        with:
          path: |
            .godot-tools/4.7.2-stable
            .godot-tools/downloads/4.7.2-stable
            artifacts/user-data/godot/export_templates/4.7.2.stable
          key: godot-web-4.7.2-stable-templates-v1
      - name: Install pinned Godot and Web export templates
        run: bash scripts/web-setup.sh
      - name: Export production and development from the same checkout
        run: |
          bash scripts/web-export.sh --stage production artifacts/web
          bash scripts/web-export.sh --stage development artifacts/web/development
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/web

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: project-rd-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
