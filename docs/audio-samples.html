<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오디오 샘플 듣기</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #171713; color: #eee8d8; }
    body { max-width: 760px; margin: 2rem auto; padding: 0 1rem 3rem; }
    h1, h2 { color: #dfc58e; }
    section { margin: 1.5rem 0; padding: 1rem; border: 1px solid #514936; border-radius: 10px; }
    .sample { display: grid; grid-template-columns: minmax(9rem, 1fr) auto; align-items: center; gap: .5rem 1rem; padding: .7rem 0; border-bottom: 1px solid #38352d; }
    .sample:last-child { border: 0; }
    button { color: inherit; background: #403b2f; border: 1px solid #8d7955; border-radius: 6px; padding: .4rem .8rem; cursor: pointer; }
    button:hover { background: #5a4d34; }
    label { color: #d1c6aa; font-size: .9rem; }
    input[type=range] { vertical-align: middle; width: 110px; }
    .repeat { grid-column: 1 / -1; }
    small { color: #b9b2a1; }
    @media (max-width: 480px) { .sample { grid-template-columns: 1fr auto; } }
  </style>
</head>
<body>
  <h1>게임 오디오 샘플</h1>
  <p>재생 버튼을 눌러 직접 들어 보세요. 자동 재생은 없습니다. 배경 음악은 낮은 기본 음량으로 설정되어 있습니다.</p>
  <section>
    <h2>배경 음악</h2>
    <small>반복 재생을 켜면 루프를 확인할 수 있습니다.</small>
    <div id="music"></div>
  </section>
  <section>
    <h2>UI 클릭</h2>
    <div id="ui"></div>
  </section>
  <section>
    <h2>용병 공격</h2>
    <div id="combat"></div>
  </section>
  <script>
    const groups = {
      music: [
        ["hearth_watch", "성문 곁의 불빛 — 따뜻한 현악과 잔잔한 선율", "../assets/audio/music/hearth_watch.ogg", true],
        ["mist_guard", "안개의 파수 — 공기감 있는 마법 앰비언스", "../assets/audio/music/mist_guard.ogg", true],
        ["quiet_march", "조용한 행군 — 둥근 저음 맥박과 짧은 선율", "../assets/audio/music/quiet_march.ogg", true]
      ],
      ui: [
        ["wood", "나무 — 묵직한 인벤토리 선택", "../assets/audio/ui/wood.wav"],
        ["tap", "탭 — 가벼운 일반 버튼", "../assets/audio/ui/tap.wav"],
        ["chime", "차임 — 확인 및 보상", "../assets/audio/ui/chime.wav"]
      ],
      combat: [
        ["blade", "검 — 낮고 짧은 스윕", "../assets/audio/combat/blade.wav"],
        ["bow", "활 — 시위와 화살 휘파람", "../assets/audio/combat/bow.wav"],
        ["blunt", "둔기 — 둥근 저음 타격", "../assets/audio/combat/blunt.wav"],
        ["magic", "마법 — 부드럽게 솟는 공명음", "../assets/audio/combat/magic.wav"],
        ["shot", "사격 — 짧고 둔탁한 발사음", "../assets/audio/combat/shot.wav"]
      ]
    };
    let current;
    for (const [group, entries] of Object.entries(groups)) {
      const host = document.getElementById(group);
      for (const [id, title, src, repeat] of entries) {
        const row = document.createElement("div");
        row.className = "sample";
        const name = document.createElement("span");
        name.textContent = title;
        const play = document.createElement("button");
        play.type = "button";
        play.textContent = "재생";
        play.setAttribute("aria-label", `${title} 재생`);
        const audio = new Audio(src);
        audio.preload = "none";
        audio.volume = group === "music" ? 0.24 : 0.42;
        audio.loop = false;
        play.addEventListener("click", () => {
          if (current && current !== audio) { current.pause(); current.currentTime = 0; }
          if (audio.paused) {
            current = audio;
            audio.currentTime = 0;
            play.textContent = "정지";
            audio.play().catch(() => { play.textContent = "재생"; if (current === audio) current = null; });
          } else { audio.pause(); audio.currentTime = 0; play.textContent = "재생"; }
        });
        row.append(name, play);
        const controls = document.createElement("label");
        controls.className = "repeat";
        const gain = document.createElement("input");
        gain.type = "range"; gain.min = "0"; gain.max = "0.7"; gain.step = "0.01";
        gain.value = String(audio.volume); gain.setAttribute("aria-label", `${title} 음량`);
        gain.addEventListener("input", () => audio.volume = Number(gain.value));
        controls.append("음량 ", gain);
        if (repeat) {
          const loop = document.createElement("input");
          loop.type = "checkbox"; loop.setAttribute("aria-label", `${title} 반복 재생`);
          loop.addEventListener("change", () => audio.loop = loop.checked);
          controls.append("　반복 ", loop);
        }
        row.append(controls);
        audio.addEventListener("pause", () => { play.textContent = "재생"; });
        audio.addEventListener("ended", () => { play.textContent = "재생"; if (current === audio) current = null; });
        host.append(row);
      }
    }
  </script>
</body>
</html>
